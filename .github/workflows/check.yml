name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # 【优化 1】开启 pip 缓存，加速依赖安装

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "5"
          CHECK_TIMEOUT: "30"

      # 注：如果你的 GitHub Pages 已经确认开启，建议将下面这个 "Ensure GitHub Pages is enabled" 步骤整体删掉，以节省每小时一次的 API 请求。
      #- name: Ensure GitHub Pages is enabled (one-time auto setup)
       # run: |
          #code=$(curl -s -o /dev/null -w '%{http_code}' \
            #-H "Authorization: Bearer $GITHUB_TOKEN" \
          #  "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          #echo "Pages API status: $code"
        #  if [ "$code" = "404" ]; then
      #     echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
        #    curl -sS -X PUT \
       #       -H "Authorization: Bearer $GITHUB_TOKEN" \
        #      -H "Content-Type: application/json" \
       #       -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
      #        "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
     #       echo
      #      sleep 10
       #   fi
      #  env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        # 【优化 2】使用动态变量替换硬编码的 "仓库用户名"，适配任意用户名和仓库名
        run: echo "site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (deploy outcome: ${{ steps.deployment.outcome }})"
